apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eduvia-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - api.eduvia.name.ng
    secretName: eduvia-api-tls
  rules:
  - host: api.eduvia.name.ng
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eduvia-app
            port:
              number: 3000
